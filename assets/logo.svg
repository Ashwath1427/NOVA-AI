<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 256" width="100%" height="100%">
  <defs>
    <!-- Primary Orbital Gradient (Indigo to Violet) -->
    <linearGradient id="orbitGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- The NOVA Star / 'N' Geometry (Scaled down and shifted left) -->
  <g transform="translate(128 128) scale(0.65)" filter="url(#glow)">
    <path d="M-40,80 L-40,-80" fill="none" stroke="url(#orbitGradient)" stroke-width="24" stroke-linecap="round" />
    <path d="M-40,-80 L40,80" fill="none" stroke="url(#orbitGradient)" stroke-width="24" stroke-linecap="round" />
    <path d="M40,80 L40,-80" fill="none" stroke="url(#orbitGradient)" stroke-width="24" stroke-linecap="round" />
    <path d="M0,-120 Q0,0 120,0 Q0,0 0,120 Q0,0 -120,0 Q0,0 0,-120 Z" fill="#F8FAFC" opacity="0.9" />
  </g>

  <!-- Typography -->
  <text x="240" y="160" font-family="'Outfit', 'Inter', sans-serif" font-weight="700" font-size="110" fill="#F8FAFC" letter-spacing="12">NOVA</text>
</svg>
