<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for Icon -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151821" />
      <stop offset="100%" stop-color="#08090D" />
    </linearGradient>
    
    <!-- Primary Orbital Gradient (Indigo to Violet) -->
    <linearGradient id="orbitGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark rounded background for the app icon -->
  <rect width="512" height="512" rx="112" fill="url(#bgGradient)" />

  <!-- Outer Orbital rings -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="2" />
  <circle cx="256" cy="256" r="120" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- The NOVA Star / 'N' Geometry -->
  <g transform="translate(256 256)" filter="url(#glow)">
    <!-- Vertical line of N -->
    <path d="M-40,80 L-40,-80" fill="none" stroke="url(#orbitGradient)" stroke-width="24" stroke-linecap="round" />
    <!-- Diagonal line of N -->
    <path d="M-40,-80 L40,80" fill="none" stroke="url(#orbitGradient)" stroke-width="24" stroke-linecap="round" />
    <!-- Right vertical line of N -->
    <path d="M40,80 L40,-80" fill="none" stroke="url(#orbitGradient)" stroke-width="24" stroke-linecap="round" />

    <!-- 4-point star accent overlay -->
    <path d="M0,-120 Q0,0 120,0 Q0,0 0,120 Q0,0 -120,0 Q0,0 0,-120 Z" fill="#F8FAFC" opacity="0.9" />
  </g>
</svg>
