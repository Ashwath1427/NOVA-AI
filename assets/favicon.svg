      <stop offset="0%" stop-color="#151821" />
      <stop offset="100%" stop-color="#08090D" />
    </linearGradient>
    <linearGradient id="orbitGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
