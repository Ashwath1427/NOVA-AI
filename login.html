<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome back - NOVA</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/login.css">
</head>
<body>
  
  <a href="/index.html" class="back-link">← Back to home</a>

  <div class="auth-viewport">
    
    <!-- Auth Card matching Phone/Command-Center Frame in Mockup -->
    <div class="auth-card" id="authCard">
      
      <!-- Top Glow Core -->
      <div class="card-glow-halo"></div>

      <!-- Main Form Container (Login & Signup) -->
      <div id="authMainView" class="auth-card-content">
        
        <!-- Brand Header with Glowing 4-Point Star -->
        <div class="auth-header">
          <div class="star-logo-container">
            <svg class="nova-star-svg" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
              <filter id="starGlowFilter" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
                <feMerge>
                  <feMergeNode in="blur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>
              <!-- 4-point Diamond Star Beam -->
              <path d="M32 2 C32 18 18 32 2 32 C18 32 32 46 32 62 C32 46 46 32 62 32 C46 32 32 18 32 2 Z" fill="url(#starGradient)" filter="url(#starGlowFilter)"/>
              <defs>
                <linearGradient id="starGradient" x1="2" y1="2" x2="62" y2="62" gradientUnits="userSpaceOnUse">
                  <stop offset="0%" stop-color="#ffffff"/>
                  <stop offset="35%" stop-color="#c7d2fe"/>
                  <stop offset="70%" stop-color="#818cf8"/>
                  <stop offset="100%" stop-color="#6366f1"/>
                </linearGradient>
              </defs>
            </svg>
            <span class="brand-text">NOVA</span>
          </div>
          <h2 id="authTitle" class="auth-title">Welcome back</h2>
          <p id="authSubtitle" class="auth-subtitle">Your command center is waiting.</p>
        </div>

        <!-- Google Continue Button -->
        <button id="googleLoginBtn" class="btn-google" type="button">
          <svg class="google-icon" width="18" height="18" viewBox="0 0 24 24">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
          </svg>
          Continue with Google
        </button>

        <div class="auth-divider">
          <span>OR</span>
        </div>

        <!-- Auth Form -->
        <form id="loginForm" class="auth-form">
          <!-- Full Name (Only visible in Signup mode) -->
          <div class="input-field-wrap" id="nameGroup" style="display: none;">
            <i data-lucide="user" class="input-icon"></i>
            <input type="text" id="fullName" class="auth-input" placeholder="Full name" autocomplete="name">
          </div>

          <!-- Email Address -->
          <div class="input-field-wrap">
            <i data-lucide="mail" class="input-icon"></i>
            <input type="email" id="email" class="auth-input" placeholder="Email address" required autocomplete="email">
          </div>
          
          <!-- Password -->
          <div class="input-field-wrap">
            <i data-lucide="lock" class="input-icon"></i>
            <input type="password" id="password" class="auth-input has-toggle" placeholder="Password" required autocomplete="current-password">
            <button type="button" id="togglePasswordBtn" class="password-toggle-btn" title="Toggle password visibility">
              <i data-lucide="eye" id="passwordEyeIcon"></i>
            </button>
          </div>

          <!-- Options Row: Remember Me & Forgot Password -->
          <div class="auth-options-row" id="authOptionsRow">
            <label class="remember-label">
              <input type="checkbox" id="rememberMe" class="remember-checkbox" checked>
              <span class="custom-check-box"></span>
              <span class="remember-text">Remember me</span>
            </label>
            <a href="#" id="forgotPasswordLink" class="forgot-link">Forgot password?</a>
          </div>

          <!-- CTA Button -->
          <button type="submit" class="btn-auth-cta" id="signInBtn">
            Log in
          </button>
        </form>

        <!-- Switch Auth Mode -->
        <div class="auth-switch-row">
          <span id="switchAuthText">Don't have an account?</span>
          <a href="#" id="toggleAuthMode" class="switch-link">Create one</a>
        </div>

      </div>

      <!-- Onboarding Step View (Mockup Column 4: "Let's get to know you") -->
      <div id="onboardingStepView" class="auth-card-content onboarding-content" style="display: none;">
        
        <!-- Step Progress Bar -->
        <div class="onboarding-top-bar">
          <div class="step-indicator">
            <span class="step-text">1 of 3</span>
            <div class="step-progress-track">
              <div class="step-progress-fill" style="width: 33%;"></div>
            </div>
          </div>
          <div class="onboarding-mini-logo">
            <svg class="mini-star-svg" viewBox="0 0 64 64" fill="none">
              <path d="M32 2 C32 18 18 32 2 32 C18 32 32 46 32 62 C32 46 46 32 62 32 C46 32 32 18 32 2 Z" fill="url(#starGradient)"/>
            </svg>
            <span>NOVA</span>
          </div>
        </div>

        <div class="onboarding-header">
          <h2 class="onboarding-title">Let's get to know you</h2>
          <p class="onboarding-subtitle">This helps NOVA create a better experience for you.</p>
        </div>

        <div class="onboarding-form">
          <div class="onboarding-field">
            <label class="onboarding-label">What's your name?</label>
            <input type="text" id="obNameInput" class="auth-input ob-input" placeholder="Your name" value="Ashwath">
          </div>

          <div class="onboarding-field">
            <label class="onboarding-label">What's your primary goal?</label>
            <div class="goal-chips-grid" id="goalChipsGrid">
              <button type="button" class="choice-chip" data-val="Study">Study</button>
              <button type="button" class="choice-chip active" data-val="Work">Work</button>
              <button type="button" class="choice-chip" data-val="Personal">Personal</button>
              <button type="button" class="choice-chip" data-val="Mixed">Mixed</button>
            </div>
          </div>

          <div class="onboarding-field">
            <label class="onboarding-label">When are you usually most productive?</label>
            <div class="time-chips-grid" id="timeChipsGrid">
              <button type="button" class="choice-chip" data-val="Morning">Morning</button>
              <button type="button" class="choice-chip" data-val="Afternoon">Afternoon</button>
              <button type="button" class="choice-chip active" data-val="Evening">Evening</button>
              <button type="button" class="choice-chip" data-val="Flexible">Flexible</button>
            </div>
          </div>

          <button type="button" id="obContinueBtn" class="btn-auth-cta" style="margin-top: 14px;">
            Continue →
          </button>

          <button type="button" id="obSkipBtn" class="skip-btn">
            Skip for now
          </button>
        </div>

      </div>

      <!-- Bottom Celestial Horizon Arc matching Mockup exactly inside the Card -->
      <div class="card-bottom-horizon">
        <div class="celestial-arc"></div>
        <p class="horizon-caption">Your day. Your projects. One intelligent command center.</p>
      </div>

    </div>
  </div>

  <div id="toastContainer" class="toast-container"></div>
  
  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/supabase.js"></script>
  <script src="/js/auth.js"></script>

  <script>
    // Lucide Icons init
    if (window.lucide) window.lucide.createIcons();

    // Password visibility toggle
    const togglePassBtn = document.getElementById('togglePasswordBtn');
    const passInput = document.getElementById('password');
    const eyeIcon = document.getElementById('passwordEyeIcon');

    if (togglePassBtn && passInput) {
      togglePassBtn.addEventListener('click', () => {
        const isPass = passInput.type === 'password';
        passInput.type = isPass ? 'text' : 'password';
        if (eyeIcon) {
          eyeIcon.setAttribute('data-lucide', isPass ? 'eye-off' : 'eye');
          if (window.lucide) window.lucide.createIcons();
        }
      });
    }

    // Toggle between Login and Signup modes
    let isSignup = false;
    const toggleAuthMode = document.getElementById('toggleAuthMode');
    const authTitle = document.getElementById('authTitle');
    const authSubtitle = document.getElementById('authSubtitle');
    const nameGroup = document.getElementById('nameGroup');
    const authOptionsRow = document.getElementById('authOptionsRow');
    const signInBtn = document.getElementById('signInBtn');
    const switchAuthText = document.getElementById('switchAuthText');

    if (toggleAuthMode) {
      toggleAuthMode.addEventListener('click', (e) => {
        e.preventDefault();
        isSignup = !isSignup;

        if (isSignup) {
          document.title = "Create your NOVA";
          if (authTitle) authTitle.textContent = "Create your NOVA";
          if (authSubtitle) authSubtitle.textContent = "Start building a more productive you.";
          if (nameGroup) nameGroup.style.display = "flex";
          if (authOptionsRow) authOptionsRow.style.display = "none";
          if (signInBtn) signInBtn.textContent = "Create account";
          if (switchAuthText) switchAuthText.textContent = "Already have an account?";
          toggleAuthMode.textContent = "Log in";
        } else {
          document.title = "Welcome back - NOVA";
          if (authTitle) authTitle.textContent = "Welcome back";
          if (authSubtitle) authSubtitle.textContent = "Your command center is waiting.";
          if (nameGroup) nameGroup.style.display = "none";
          if (authOptionsRow) authOptionsRow.style.display = "flex";
          if (signInBtn) signInBtn.textContent = "Log in";
          if (switchAuthText) switchAuthText.textContent = "Don't have an account?";
          toggleAuthMode.textContent = "Create one";
        }
        if (window.lucide) window.lucide.createIcons();
      });
    }

    // Interactive chips on onboarding view
    document.querySelectorAll('#goalChipsGrid .choice-chip').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#goalChipsGrid .choice-chip').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      });
    });

    document.querySelectorAll('#timeChipsGrid .choice-chip').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#timeChipsGrid .choice-chip').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      });
    });

    // Check if onboarding URL param exists
    if (new URLSearchParams(window.location.search).get('onboarding') === 'true') {
      document.getElementById('authMainView').style.display = 'none';
      document.getElementById('onboardingStepView').style.display = 'block';
    }

    const obContinueBtn = document.getElementById('obContinueBtn');
    const obSkipBtn = document.getElementById('obSkipBtn');

    if (obContinueBtn) {
      obContinueBtn.addEventListener('click', async () => {
        const name = document.getElementById('obNameInput')?.value?.trim() || 'Ashwath';
        const goal = document.querySelector('#goalChipsGrid .choice-chip.active')?.dataset.val || 'Work';
        const time = document.querySelector('#timeChipsGrid .choice-chip.active')?.dataset.val || 'Evening';
        
        localStorage.setItem('nova_user_profile', JSON.stringify({
          full_name: name,
          primary_goal: goal,
          typical_available_time: time
        }));

        if (window.supabaseClient) {
          try {
            const { data: { session } } = await window.supabaseClient.auth.getSession();
            if (session) {
              await window.supabaseClient.from('profiles').update({
                full_name: name,
                primary_goal: goal,
                typical_available_time: time
              }).eq('id', session.user.id);
            }
          } catch(e) {}
        }

        window.location.href = window.novaPath('app.html');
      });
    }

    if (obSkipBtn) {
      obSkipBtn.addEventListener('click', () => {
        window.location.href = window.novaPath('app.html');
      });
    }
  </script>
</body>
</html>
