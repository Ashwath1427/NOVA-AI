<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FocusForge - Blocked</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --panel-bg: rgba(30, 41, 59, 0.7);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent-color: #3b82f6;
    }
    body {
      background-color: var(--bg-color);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .container {
      background: var(--panel-bg);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 40px;
      max-width: 500px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    h1 {
      font-size: 32px;
      margin-bottom: 16px;
      background: linear-gradient(to right, #ef4444, #f59e0b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: var(--text-secondary);
      margin-bottom: 24px;
      line-height: 1.6;
    }
    .quote {
      font-style: italic;
      color: #e2e8f0;
      border-left: 4px solid var(--accent-color);
      padding-left: 16px;
      margin-bottom: 32px;
      text-align: left;
    }
    input {
      width: 100%;
      padding: 12px;
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      border-radius: 8px;
      margin-bottom: 16px;
    }
    .primary-btn {
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      margin-top: 24px;
      transition: all 0.2s ease;
    }
    .primary-btn:hover {
      background: #2563eb;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
    }
    .primary-btn:active {
      transform: translateY(0);
      box-shadow: none;
    }
    .primary-btn:disabled {
      background: #475569;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    
    /* Toast Notification */
    .toast-container {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 9999;
      pointer-events: none;
    }
    .toast {
      background: rgba(30, 41, 59, 0.95);
      backdrop-filter: blur(10px);
      border-left: 4px solid var(--accent-color);
      color: white;
      padding: 16px 24px;
      border-radius: 6px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      font-size: 14px;
      transform: translateY(120%);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }
    .toast.error {
      border-left-color: #ef4444;
    }
    .toast.success {
      border-left-color: #22c55e;
    }
  </style>
</head>
<body>
  
  <div id="toast-container" class="toast-container"></div>

  <div class="container">
    <h1>Focus Mode Active 🛡️</h1>
    <p>You tried to visit <strong id="blocked-url">this site</strong>.</p>
    
    <div class="quote" id="quote">
      "Discipline is choosing between what you want now and what you want most." - Abraham Lincoln
    </div>

    <div id="override-section">
      <p style="font-size: 14px; margin-bottom: 8px;">Need this for urgent work?</p>
      <input type="text" id="reason-input" placeholder="Brief reason (e.g., checking project link)...">
      <button id="override-btn" class="primary-btn">Allow for 10 minutes</button>
    </div>
  </div>

  <script src="blocked.js"></script>
</body>
</html>
