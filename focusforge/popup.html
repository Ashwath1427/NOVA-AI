<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FocusForge</title>
  <link rel="stylesheet" href="popup.css">
  <style>
    /* Toast Notification */
    .toast-container {
      position: fixed;
      bottom: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 9999;
      pointer-events: none;
    }
    .toast {
      background: rgba(30, 41, 59, 0.95);
      backdrop-filter: blur(10px);
      border-left: 4px solid var(--accent-color);
      color: white;
      padding: 12px 16px;
      border-radius: 6px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      font-size: 13px;
      transform: translateY(120%);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }
    .toast.error {
      border-left-color: #ef4444;
    }
    .toast.success {
      border-left-color: #22c55e;
    }
  </style>
</head>
<body>
  <div id="toast-container" class="toast-container"></div>
  <div class="container">
    <header>
      <div class="header-top">
        <h1>FocusForge</h1>
        <div class="streak-badge">🔥 <span id="streak-count">0</span></div>
      </div>
      <div class="level-container">
        <span id="level-name">Novice</span>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="level-progress"></div>
        </div>
        <span class="points-text"><span id="points-count">0</span> pts</span>
      </div>
    </header>

    <main>
      <div class="focus-card glass-panel">
        <div class="score-ring">
          <svg viewBox="0 0 36 36" class="circular-chart">
            <path class="circle-bg"
              d="M18 2.0845
                a 15.9155 15.9155 0 0 1 0 31.831
                a 15.9155 15.9155 0 0 1 0 -31.831"
            />
            <path class="circle" id="focus-score-circle"
              stroke-dasharray="0, 100"
              d="M18 2.0845
                a 15.9155 15.9155 0 0 1 0 31.831
                a 15.9155 15.9155 0 0 1 0 -31.831"
            />
            <text x="18" y="20.35" class="score-text" id="focus-score-text">100</text>
          </svg>
          <div class="score-label">Focus Score</div>
        </div>

        <div class="timer-section">
          <h2 id="timer-display">25:00</h2>
          <div id="custom-time-container" style="display: flex; gap: 8px; align-items: center; margin-bottom: 8px;">
            <input type="number" id="custom-time-input" value="25" min="1" max="240" style="width: 60px; padding: 4px; border-radius: 4px; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.2); color: white; text-align: center;">
            <span style="font-size: 12px; color: var(--text-secondary);">min</span>
          </div>
          <button id="toggle-timer-btn" class="primary-btn">Start Focus</button>
        </div>
      </div>

      <div class="garden-card glass-panel">
        <h3>Virtual Garden 🌱</h3>
        <div id="garden-container" class="garden-grid">
          <!-- Trees will populate here -->
        </div>
      </div>

      <div class="coach-card glass-panel">
        <h3>AI Coach 🤖</h3>
        <p id="coach-message">Ready to build some great habits today?</p>
      </div>

    </main>

    <footer>
      <button id="settings-btn" class="icon-btn">⚙️ Settings</button>
      <button id="stats-btn" class="icon-btn">📊 Stats</button>
    </footer>
  </div>


  
  <div id="reward-overlay" class="modal-overlay" style="display: none; z-index: 2000;">
    <div class="modal-content glass-panel" style="text-align: center;">
      <h1 style="font-size: 50px; margin-bottom: 16px; background: none; -webkit-text-fill-color: initial;">🎉</h1>
      <h2 style="font-size: 24px; color: white;">Focus Complete!</h2>
      <p id="reward-text" style="color: var(--success-color); font-weight: bold; font-size: 18px; margin: 16px 0;">+10 Points</p>
      <button id="claim-reward-btn" class="primary-btn" style="width: 100%; padding: 12px; font-size: 16px;">Claim Reward</button>
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
