<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FocusForge - Settings</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --panel-bg: rgba(30, 41, 59, 0.7);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent-color: #3b82f6;
      --danger-color: #ef4444;
      --success-color: #22c55e;
    }
    body {
      background-color: var(--bg-color);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      padding: 40px;
      max-width: 800px;
      margin: 0 auto;
    }
    
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 10px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-color);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 5px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .glass-panel {
      background: var(--panel-bg);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
    }
    h1 {
      margin-bottom: 32px;
      font-size: 28px;
    }
    h2 {
      font-size: 18px;
      margin-bottom: 16px;
      color: var(--accent-color);
    }
    input[type="text"], input[type="number"], input[type="password"] {
      width: 100%;
      padding: 10px;
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      border-radius: 6px;
      margin-bottom: 8px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    input:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.3);
    }
    button {
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
    }
    ul {
      list-style-type: none;
      padding: 0;
      margin-bottom: 16px;
    }
    li {
      display: flex;
      justify-content: space-between;
      padding: 8px;
      background: rgba(255,255,255,0.05);
      border-radius: 4px;
      margin-bottom: 4px;
    }
    .remove-btn {
      background: #ef4444;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s ease;
    }
    button:hover {
      background: #2563eb;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }
    button:active {
      transform: translateY(1px);
      box-shadow: none;
    }
    .danger {
      background: #ef4444;
      margin-top: 16px;
    }
    .danger:hover {
      background: #dc2626;
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
    }
    
    /* Toast Notification */
    .toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 9999;
    }
    .toast {
      background: rgba(30, 41, 59, 0.95);
      backdrop-filter: blur(10px);
      border-left: 4px solid var(--accent-color);
      color: white;
      padding: 16px 24px;
      border-radius: 6px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      font-size: 14px;
      transform: translateX(120%);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .toast.show {
      transform: translateX(0);
      opacity: 1;
    }
    .toast.error {
      border-left-color: var(--danger-color);
    }
    .toast.success {
      border-left-color: var(--success-color);
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--bg-color);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-content {
      width: 100%;
      max-width: 400px;
    }
  </style>
</head>
<body>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container"></div>
  
  <div id="settings-content" style="display: block;">
    <h1>⚙️ Settings</h1>

  <div class="glass-panel">
    <h2>Blocked Websites</h2>
    <ul id="blocklist">
      <!-- Populated via JS -->
    </ul>
    <div style="display: flex; gap: 8px;">
      <input type="text" id="new-site" placeholder="e.g. reddit.com">
      <button id="add-site-btn">Add</button>
    </div>
  </div>

  <div class="glass-panel">
    <h2>Goals & Timers</h2>
    <label>Daily Distraction Goal (minutes):</label>
    <input type="number" id="daily-goal" value="120">
    <br><br>
    <label>Focus Session Length (minutes):</label>
    <input type="number" id="session-length" value="25">
    <br><br>
    <button id="save-settings-btn">Save Preferences</button>
  </div>

  <div class="glass-panel">
    <h2>Data Management</h2>
    <button id="export-btn">Export Data (CSV)</button>
    <button id="reset-btn" class="danger">Reset All Progress</button>
  </div>
  </div>

  <script src="options.js"></script>
</body>
</html>
